# base-url is set via NTFY_BASE_URL env in compose (NTFY_BASE_URL overrides this file)
base-url: "https://ntfy.esembe.app"
listen-http: ":80"
behind-proxy: true
upstream-base-url: "https://ntfy.sh"
auth-file: /var/lib/ntfy/user.db
auth-default-access: "deny-all"
cache-file: /var/cache/ntfy/cache.db
# All app users publish through one server-side account and visitor IP.
visitor-request-limit-burst: 1000
visitor-request-limit-replenish: "1s"
# Users and tokens contain secrets and come from the environment (compose.yaml):
#   NTFY_AUTH_USERS  = pinger:<bcrypt hash>:user
#   NTFY_AUTH_TOKENS = pinger:<NTFY_APP_TOKEN>:app
# Only the app user may publish; anonymous clients may only read unguessable tp-* topics.
auth-access:
  - "pinger:tp-*:rw"
  - "everyone:tp-*:ro"
