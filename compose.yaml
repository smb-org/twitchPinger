services:
  app:
    build: .
    env_file: .env
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:12080:12080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:12080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_AUTH_USERS: "marble:${NTFY_MARBLE_PASS_HASH}:user"
      NTFY_AUTH_TOKENS: "marble:${NTFY_APP_TOKEN}:app"
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    restart: unless-stopped
volumes:
  app-data:
  ntfy-cache:
  ntfy-auth:
